<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda · Somos Um</title>
<meta name="description" content="Cultos e eventos do Ministério Cristão Somos Um, Colombo-PR.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #f6f5f3; --card: #fff; --ink: #1b1b1b; --muted: #6b6b6b; --line: #e4e1dc; --red: #c4161c; --red-soft: #fbe9e9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1d1d1d; --ink: #f1f1f1; --muted: #a3a3a3; --line: #333; --red: #ef4b50; --red-soft: #3a1c1d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: #111; color: #fff; padding: 22px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 20px; }
  header h1 span { color: #ff5a5f; }
  header p { margin: 6px 0 0; color: #ccc; font-size: 14px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 90px; }
  h2 { font-size: 14px; margin: 22px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .dia { font-weight: 700; margin: 18px 0 8px; }
  .dia.hoje::after { content: 'HOJE'; font-size: 11px; background: var(--red); color: #fff; border-radius: 99px; padding: 2px 8px; margin-left: 8px; vertical-align: 2px; }
  .ev { display: flex; gap: 14px; align-items: flex-start; }
  .hora { flex: none; width: 58px; font-weight: 700; color: var(--red); font-size: 17px; }
  .titulo { font-weight: 600; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 3px; white-space: pre-line; }
  .fixos .ev { padding: 8px 0; border-top: 1px solid var(--line); }
  .fixos .ev:first-child { border-top: 0; padding-top: 0; }
  .fixos .hora { width: auto; min-width: 58px; }
  .vazio { color: var(--muted); text-align: center; padding: 22px 10px; }
  .botoes { display: grid; gap: 10px; margin-top: 18px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; text-decoration: none; border: 0; cursor: pointer; font-family: inherit; }
  .btn-insta { background: linear-gradient(45deg, #f58529, #dd2a7b 45%, #8134af 75%, #515bd4); color: #fff; }
  .btn-sec { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .mais { display: block; margin: 6px auto 0; background: none; border: 0; color: var(--red); font-weight: 600; font-size: 15px; padding: 10px; cursor: pointer; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 26px; }
</style>
</head>
<body>
<header>
  <h1>Agenda <span>·</span> Somos Um</h1>
  <p>Ministério Cristão Somos Um · Colombo-PR</p>
</header>
<main>
  <h2>Próximos dias</h2>
  <div id="proximos"><div class="card vazio">Carregando…</div></div>
  <button class="mais" id="ver-mais" hidden>Ver mais datas</button>
  <h2>Toda semana</h2>
  <div class="card fixos" id="fixos"></div>
  <div class="botoes">
    <a class="btn btn-insta" id="insta" target="_blank" rel="noopener"></a>
    <button class="btn btn-sec" id="compartilhar">Compartilhar a agenda</button>
  </div>
  <footer>Somos um em Cristo Jesus. Venha com a gente! 🙌</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="agenda.js"></script>
<script>
const sb = supabase.createClient('https://kucctooazibqfzlmqsws.supabase.co', 'sb_publishable_4yxH3tJotLPLK3LDiYb01A_7dsS2xpn');
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
$('#insta').href = INSTAGRAM.url;
$('#insta').innerHTML = `${ICONE_INSTAGRAM} Siga no Instagram ${INSTAGRAM.arroba}`;

let dados = { itens: [], cultos: [] }, dias = 30;
const hoje = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };

function linha(e) {
  const sub = [e.ate ? 'até ' + agFmtData(e.ate).toLowerCase() : '', e.local, e.descricao].filter(Boolean).map(esc).join('\n');
  return `<div class="ev"><div class="hora">${esc(agHora(e.hora)) || '—'}</div><div><div class="titulo">${esc(e.titulo)}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div></div>`;
}

function render() {
  const lista = expandirAgenda(dados.itens, dados.cultos, hoje(), dias);
  let html = '', ultima = '';
  for (const e of lista) {
    const chave = agIso(e.data);
    if (chave !== ultima) {
      if (ultima) html += '</div>';
      html += `<div class="dia ${chave === agIso(hoje()) ? 'hoje' : ''}">${agFmtData(e.data)}</div><div class="card">`;
      ultima = chave;
    } else html += '<div style="height:12px"></div>';
    html += linha(e);
  }
  if (ultima) html += '</div>';
  $('#proximos').innerHTML = html || '<div class="card vazio">Nenhum compromisso nos próximos dias.</div>';
  $('#ver-mais').hidden = dias >= 120;
  const fixos = dados.itens.filter((i) => i.tipo === 'fixo').sort((a, b) => ((a.dia_semana + 6) % 7) - ((b.dia_semana + 6) % 7) || agMinutos(a.hora) - agMinutos(b.hora));
  $('#fixos').innerHTML = fixos.map((i) => `<div class="ev"><div class="hora">${esc(agHora(i.hora))}</div><div><div class="titulo">${esc(i.titulo)}</div><div class="sub">${esc(agNomeSemana(i.dia_semana, i.semana_do_mes))}${i.local ? ' · ' + esc(i.local) : ''}</div></div></div>`).join('')
    || '<div class="vazio">Em breve.</div>';
}

$('#ver-mais').onclick = () => { dias = 120; render(); };
$('#compartilhar').onclick = async () => {
  const lista = expandirAgenda(dados.itens, dados.cultos, hoje(), 7);
  const texto = textoAgendaWhats(lista, 'Agenda da semana');
  if (navigator.share) { try { await navigator.share({ text: texto }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  location.href = 'https://wa.me/?text=' + encodeURIComponent(texto);
};

sb.rpc('agenda_publica').then(({ data, error }) => {
  if (error || !data) { $('#proximos').innerHTML = '<div class="card vazio">Não foi possível carregar a agenda agora. Tente de novo mais tarde.</div>'; return; }
  dados = data; render();
});
</script>
</body>
</html>
