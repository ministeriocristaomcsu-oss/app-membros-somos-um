<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listagem de membros</title>
<meta name="theme-color" content="#111111">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<style>
  :root { --red: #c4161c; --ink: #1b1b1b; --muted: #6b6b6b; --line: #e4e1dc; --bg: #f6f5f3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: #111; color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; }
  header h1 small { display: block; font-size: 11px; font-weight: 600; color: #ff5a5f; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
  header a { color: #ddd; border: 1px solid #555; border-radius: 8px; padding: 6px 10px; font-size: 13px; text-decoration: none; white-space: nowrap; }
  .tela { max-width: 1200px; margin: 0 auto; padding: 16px 16px 120px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 860px) { .tela { grid-template-columns: minmax(0, 1fr); } }
  .painel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .painel h2 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .painel h2:first-child { margin-top: 2px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; background: #fff; color: var(--ink); font-family: inherit; }
  .colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  .check { display: flex; gap: 8px; align-items: center; margin: 6px 0 0; font-size: 14px; color: var(--ink); }
  .check input { width: 18px; height: 18px; margin: 0; flex: none; }
  .btn { border: 0; border-radius: 10px; padding: 12px 14px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
  .btn-pri { background: var(--red); color: #fff; }
  .btn-sec { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .dica { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
  .aviso { background: #fbe9e9; color: var(--red); border-radius: 8px; padding: 12px; font-size: 14px; margin-bottom: 12px; }
  .oculto { display: none !important; }

  .folha { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; overflow-x: auto; }
  .cab { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--red); padding-bottom: 10px; margin-bottom: 8px; }
  .cab img { height: 52px; width: auto; max-width: 120px; object-fit: contain; }
  .cab h3 { margin: 0; font-size: 17px; }
  .cab .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); border-bottom: 1px solid #bbb; padding: 6px 6px; white-space: nowrap; }
  td { border-bottom: 1px solid var(--line); padding: 6px 6px; vertical-align: top; }
  td.n { color: var(--muted); width: 1%; text-align: right; }
  td.nome { font-weight: 600; }
  td.ass { min-width: 160px; }
  tr.grupo td { background: #f3f1ee; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--red); padding-top: 10px; }
  .rodape { font-size: 11px; color: var(--muted); margin-top: 10px; }
  .vazio { color: var(--muted); text-align: center; padding: 30px 10px; }

  @page { size: A4 portrait; margin: 12mm 10mm; }
  @media print {
    body { background: #fff; }
    header, .painel { display: none !important; }
    .tela { display: block; padding: 0; max-width: none; }
    .folha { border: 0; border-radius: 0; padding: 0; overflow: visible; }
    table { font-size: 10.5pt; }
    thead { display: table-header-group; }
    tr { break-inside: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<header>
  <h1>Listagem de membros<small>Ministério Cristão Somos Um</small></h1>
  <a href="./#membros">Voltar ao app</a>
</header>

<div class="tela">
  <section class="painel">
    <h2>Quem entra</h2>
    <label for="l-grupo">Grupo</label>
    <select id="l-grupo">
      <option value="membros">Membros (batizados, obreiros, líderes, pastores)</option>
      <option value="todos">Todos os cadastrados</option>
      <option value="kids">🧸 Kids (0 a 11 anos)</option>
      <option value="adolescentes">🎒 Adolescentes (12 a 17)</option>
      <option value="jovens">🔥 Jovens (18 a 29)</option>
      <option value="adultos">Adultos (30 anos ou mais)</option>
      <option value="cat:crianca_jovem">Crianças e jovens não batizados</option>
      <option value="cat:congregado">Congregados</option>
      <option value="cat:obreiro">Obreiros</option>
      <option value="cat:lider">Líderes</option>
      <option value="cat:pastor">Pastores</option>
      <option value="cat:visitante">Visitantes cadastrados como membro</option>
    </select>
    <label for="l-situacao">Situação</label>
    <select id="l-situacao"><option value="ativo">Só ativos</option><option value="inativo">Só inativos</option><option value="todos">Ativos e inativos</option></select>
    <label for="l-sexo">Sexo</label>
    <select id="l-sexo"><option value="">Todos</option><option value="feminino">Mulheres</option><option value="masculino">Homens</option></select>
    <label for="l-ordem">Ordem</label>
    <select id="l-ordem"><option value="nome">Nome (A a Z)</option><option value="mes">Mês do aniversário</option><option value="bairro">Bairro</option><option value="faixa">Faixa de idade</option></select>

    <h2>Colunas</h2>
    <div class="colunas" id="l-colunas"></div>
    <label class="check" style="margin-top:12px"><input type="checkbox" id="l-assinatura"> Espaço para assinatura (lista de presença)</label>

    <button class="btn btn-pri" id="l-imprimir">🖨️ Imprimir ou salvar PDF</button>
    <button class="btn btn-sec" id="l-planilha">📊 Baixar planilha (Excel)</button>
    <button class="btn btn-sec" id="l-copiar">📋 Copiar para o WhatsApp</button>
    <p class="dica">No celular, em "Imprimir" escolha "Salvar como PDF" para mandar o arquivo. CPF e RG não entram na listagem.</p>
  </section>

  <section class="folha">
    <div id="aviso" class="aviso oculto"></div>
    <div class="cab">
      <img src="img/logo-somos-um.png" alt="">
      <div><h3 id="t-titulo">Listagem de membros</h3><div class="sub" id="t-sub"></div></div>
    </div>
    <div id="tabela"><div class="vazio">Carregando…</div></div>
    <div class="rodape" id="t-rodape"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://kucctooazibqfzlmqsws.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4yxH3tJotLPLK3LDiYb01A_7dsS2xpn';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ESTADOS_CIVIS = { solteiro: 'Solteiro(a)', casado: 'Casado(a)', uniao_estavel: 'União estável', divorciado: 'Divorciado(a)', viuvo: 'Viúvo(a)' };
const CATEGORIAS = { membro: 'Membro', congregado: 'Congregado', visitante: 'Visitante', obreiro: 'Obreiro', lider: 'Líder', pastor: 'Pastor(a)', crianca_jovem: 'Não batizado' };
const FAIXAS = { kids: { nome: 'Kids', de: 0, ate: 11 }, adolescentes: { nome: 'Adolescentes', de: 12, ate: 17 }, jovens: { nome: 'Jovens', de: 18, ate: 29 }, adultos: { nome: 'Adultos', de: 30, ate: 200 } };
const ORDEM_FAIXA = ['kids', 'adolescentes', 'jovens', 'adultos', null];
const ehMembro = (m) => m.categoria !== 'crianca_jovem' && m.categoria !== 'visitante';

function hoje() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function partes(iso) { if (!iso) return null; const [a, m, d] = iso.split('-').map(Number); return { a, m, d }; }
function fmtIso(iso) { const p = partes(iso); return p ? `${String(p.d).padStart(2, '0')}/${String(p.m).padStart(2, '0')}/${p.a}` : ''; }
function idade(m) {
  const p = partes(m.nascimento); if (!p) return null;
  const b = hoje(); let n = b.getFullYear() - p.a;
  if (b.getMonth() + 1 < p.m || (b.getMonth() + 1 === p.m && b.getDate() < p.d)) n--;
  return n;
}
function faixa(m) { const n = idade(m); return n == null ? null : Object.keys(FAIXAS).find((k) => n >= FAIXAS[k].de && n <= FAIXAS[k].ate) || null; }
function endereco(m) {
  const rua = [m.endereco, m.numero].filter(Boolean).join(', ');
  return [rua, m.complemento].filter(Boolean).join(' - ');
}

// Colunas possíveis: rótulo, valor e se vem marcada
const COLUNAS = {
  telefone: { rotulo: 'Telefone', valor: (m) => m.telefone || '', padrao: true },
  nascimento: { rotulo: 'Nascimento', valor: (m) => fmtIso(m.nascimento), padrao: true },
  idade: { rotulo: 'Idade', valor: (m) => idade(m) ?? '', padrao: true },
  faixa: { rotulo: 'Faixa', valor: (m) => (faixa(m) ? FAIXAS[faixa(m)].nome : ''), padrao: false },
  vinculo: { rotulo: 'Vínculo', valor: (m) => CATEGORIAS[m.categoria] || m.categoria || '', padrao: true },
  sexo: { rotulo: 'Sexo', valor: (m) => ({ masculino: 'M', feminino: 'F' }[m.sexo] || ''), padrao: false },
  estado_civil: { rotulo: 'Estado civil', valor: (m) => ESTADOS_CIVIS[m.estado_civil] || '', padrao: false },
  casamento: { rotulo: 'Casamento', valor: (m) => fmtIso(m.casamento), padrao: false },
  batismo: { rotulo: 'Batismo', valor: (m) => (m.data_batismo ? fmtIso(m.data_batismo) : m.batizado ? 'Sim' : ''), padrao: false },
  email: { rotulo: 'E-mail', valor: (m) => m.email || '', padrao: false },
  endereco: { rotulo: 'Endereço', valor: endereco, padrao: false },
  bairro: { rotulo: 'Bairro', valor: (m) => m.bairro || '', padrao: false },
  cidade: { rotulo: 'Cidade', valor: (m) => [m.cidade, m.uf].filter(Boolean).join('/'), padrao: false },
};

let membros = [];
let linhasAtuais = [];

// Guarda as escolhas no aparelho para a próxima vez
const CHAVE = 'listagem-membros-v1';
function lerPrefs() { try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch { return {}; } }
function salvarPrefs() {
  const p = { grupo: $('#l-grupo').value, situacao: $('#l-situacao').value, sexo: $('#l-sexo').value, ordem: $('#l-ordem').value,
    assinatura: $('#l-assinatura').checked, colunas: colunasMarcadas() };
  try { localStorage.setItem(CHAVE, JSON.stringify(p)); } catch {}
}
function colunasMarcadas() { return [...document.querySelectorAll('#l-colunas input:checked')].map((i) => i.value); }

function montarPainel() {
  const p = lerPrefs();
  const marcadas = p.colunas || Object.keys(COLUNAS).filter((k) => COLUNAS[k].padrao);
  $('#l-colunas').innerHTML = Object.entries(COLUNAS).map(([k, c]) =>
    `<label class="check"><input type="checkbox" value="${k}" ${marcadas.includes(k) ? 'checked' : ''}> ${c.rotulo}</label>`).join('');
  for (const k of ['grupo', 'situacao', 'sexo', 'ordem']) if (p[k] != null && [...$('#l-' + k).options].some((o) => o.value === p[k])) $('#l-' + k).value = p[k];
  $('#l-assinatura').checked = !!p.assinatura;
  document.querySelectorAll('.painel select, .painel input').forEach((el) => (el.onchange = () => { salvarPrefs(); render(); }));
}

function filtrar() {
  const grupo = $('#l-grupo').value, situacao = $('#l-situacao').value, sexo = $('#l-sexo').value;
  let lista = membros.filter((m) => (situacao === 'todos' || (m.situacao || 'ativo') === situacao) && (!sexo || m.sexo === sexo));
  if (grupo === 'membros') lista = lista.filter(ehMembro);
  else if (grupo.startsWith('cat:')) lista = lista.filter((m) => m.categoria === grupo.slice(4));
  else if (FAIXAS[grupo]) lista = lista.filter((m) => faixa(m) === grupo);
  return lista;
}

function ordenar(lista) {
  const ordem = $('#l-ordem').value;
  const porNome = (a, b) => a.nome.localeCompare(b.nome, 'pt-BR');
  const chave = {
    nome: () => '',
    mes: (m) => { const p = partes(m.nascimento); return p ? p.m * 100 + p.d : 9999; },
    bairro: (m) => (m.bairro || '').trim().toLowerCase() || '~',
    faixa: (m) => ORDEM_FAIXA.indexOf(faixa(m)),
  }[ordem];
  return [...lista].sort((a, b) => { const x = chave(a), y = chave(b); return x < y ? -1 : x > y ? 1 : porNome(a, b); });
}

function grupoDe(m) {
  const ordem = $('#l-ordem').value;
  if (ordem === 'mes') { const p = partes(m.nascimento); return p ? MESES[p.m - 1] : 'sem data de nascimento'; }
  if (ordem === 'bairro') return (m.bairro || '').trim() || 'sem bairro';
  if (ordem === 'faixa') return faixa(m) ? FAIXAS[faixa(m)].nome : 'sem data de nascimento';
  return null;
}

function descricaoFiltro() {
  const g = $('#l-grupo').value;
  const partesTxt = [g === 'membros' ? 'Membros' : $('#l-grupo').selectedOptions[0].text.replace(/^\S+\s(?=[A-Z])/u, '')];
  const sit = $('#l-situacao').value; if (sit !== 'ativo') partesTxt.push(sit === 'inativo' ? 'inativos' : 'ativos e inativos');
  if ($('#l-sexo').value) partesTxt.push($('#l-sexo').selectedOptions[0].text.toLowerCase());
  return partesTxt.join(' · ');
}

function render() {
  const lista = ordenar(filtrar());
  linhasAtuais = lista;
  const cols = colunasMarcadas();
  const ass = $('#l-assinatura').checked;
  const d = hoje();
  $('#t-titulo').textContent = 'Listagem de membros';
  $('#t-sub').textContent = `${descricaoFiltro()} · ${lista.length} ${lista.length === 1 ? 'pessoa' : 'pessoas'}`;
  $('#t-rodape').textContent = `Gerada em ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} · Ministério Cristão Somos Um · uso interno da igreja (LGPD)`;
  if (!lista.length) { $('#tabela').innerHTML = '<div class="vazio">Ninguém com esses filtros.</div>'; return; }
  const totalCols = 2 + cols.length + (ass ? 1 : 0);
  let html = `<table><thead><tr><th>#</th><th>Nome</th>${cols.map((k) => `<th>${COLUNAS[k].rotulo}</th>`).join('')}${ass ? '<th>Assinatura</th>' : ''}</tr></thead><tbody>`;
  let ultimo, n = 0;
  for (const m of lista) {
    const g = grupoDe(m);
    if (g != null && g !== ultimo) { html += `<tr class="grupo"><td colspan="${totalCols}">${esc(g)}</td></tr>`; ultimo = g; }
    html += `<tr><td class="n">${++n}</td><td class="nome">${esc(m.nome)}</td>${cols.map((k) => `<td>${esc(COLUNAS[k].valor(m))}</td>`).join('')}${ass ? '<td class="ass"></td>' : ''}</tr>`;
  }
  $('#tabela').innerHTML = html + '</tbody></table>';
}

// Planilha: CSV com ; e BOM, que o Excel em português abre direto com acentos
function baixarPlanilha() {
  const cols = colunasMarcadas();
  const cel = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const linhas = [['Nome', ...cols.map((k) => COLUNAS[k].rotulo)].map(cel).join(';')];
  for (const m of linhasAtuais) linhas.push([m.nome, ...cols.map((k) => COLUNAS[k].valor(m))].map(cel).join(';'));
  const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  const d = hoje();
  a.href = URL.createObjectURL(blob);
  a.download = `membros-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function copiarTexto() {
  const cols = colunasMarcadas().filter((k) => k !== 'endereco' && k !== 'email');
  const txt = `*${descricaoFiltro()}* (${linhasAtuais.length})\n\n` + linhasAtuais.map((m, i) =>
    `${i + 1}. ${m.nome}${cols.map((k) => COLUNAS[k].valor(m)).filter((v) => v !== '').map((v) => ' · ' + v).join('')}`).join('\n');
  navigator.clipboard.writeText(txt).then(() => alert('Lista copiada. É só colar no WhatsApp.'), () => alert('Não foi possível copiar.'));
}

function aviso(t) { $('#aviso').textContent = t; $('#aviso').classList.remove('oculto'); }

(async function iniciar() {
  montarPainel();
  $('#l-imprimir').onclick = () => window.print();
  $('#l-planilha').onclick = baixarPlanilha;
  $('#l-copiar').onclick = copiarTexto;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#tabela').innerHTML = ''; return aviso('Entre no app primeiro (com seu login) e depois toque de novo em "Listagem".'); }
  const { data, error } = await sb.from('membros').select('*').order('nome');
  if (error) { $('#tabela').innerHTML = ''; return aviso('Não foi possível carregar os membros: ' + error.message); }
  membros = data || [];
  render();
})();
</script>
</body>
</html>
