<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartaz de Visitantes</title>
<style>
  @page { size: A4; margin: 18mm; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #111; text-align: center; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  .logo { width: 90px; height: 90px; }
  h1 { font-size: 40px; margin: 16px 0 6px; }
  h1 span { color: #c4161c; }
  p { font-size: 20px; margin: 8px 0; }
  .qr { width: 340px; max-width: 80vw; height: auto; image-rendering: pixelated; margin: 24px auto 8px; display: block; }
  .link { font-size: 15px; color: #555; word-break: break-all; }
  .rodape { margin-top: 28px; font-size: 16px; color: #555; }
  button { margin-top: 24px; border: 0; border-radius: 10px; padding: 14px 24px; font-size: 16px; font-weight: 600; background: #c4161c; color: #fff; cursor: pointer; }
  @media print { button { display: none; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="icone-192.png" alt="">
  <h1>É a sua primeira vez <span>·</span> aqui?</h1>
  <p>Que alegria ter você com a gente!</p>
  <p>Aponte a câmera do celular e deixe o seu contato:</p>
  <img class="qr" src="qrcode-visitante.png" alt="QR code para visitantes">
  <div class="link">crm-ministerio-somos-um.netlify.app/visitante.html</div>
  <div class="rodape">Ministério Cristão Somos Um · Colombo-PR</div>
  <button onclick="print()">Imprimir</button>
</main>
</body>
</html>
